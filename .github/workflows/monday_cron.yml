name: Monday Eventbrite Digest

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper
        env:
          SENDER_EMAIL: "topongo@gmail.com"
          RECEIVER_EMAIL: "topongo@gmail.com"
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python eventbrite_scraper.py
